services:
  postgres:
    image: postgres:16-alpine
    container_name: financetracker-postgres
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - '${POSTGRES_PORT}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  postgres-e2e:
    image: postgres:16-alpine
    container_name: financetracker-postgres-e2e
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: financetracker-postgres-e2e
    ports:
      - '5433:5432'
    volumes:
      - postgres_e2e_data:/var/lib/postgresql/data
    restart: unless-stopped

  postgres-test:
    image: postgres:16-alpine
    container_name: financetracker-postgres-test
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: financetrackerpro_test
    ports:
      - '5434:5432'
    volumes:
      - postgres_test_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres_data:
  postgres_e2e_data:
  postgres_test_data:
