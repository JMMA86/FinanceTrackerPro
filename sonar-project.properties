# FinanceTrackerPro - SonarQube Configuration

# Server (local instance)
sonar.host.url=http://localhost:9000

# Project identification
sonar.projectKey=financetrackerpro
sonar.projectName=FinanceTrackerPro
sonar.projectVersion=1.0

# Source code directory
sonar.sources=src
sonar.sourceEncoding=UTF-8

# Exclusions
sonar.exclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx,**/node_modules/**,**/.next/**,**/dist/**,**/build/**,**/coverage/**,**/prisma/migrations/**,src/app/globals.css

# Test files
sonar.tests=src
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx

# Coverage
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.typescript.lcov.reportPaths=coverage/lcov.info

# TypeScript settings
sonar.typescript.tsconfigPath=tsconfig.json

# Code quality thresholds
sonar.qualitygate.wait=true
sonar.coverage.exclusions=**/*.test.ts,**/*.test.tsx,**/*.config.ts,**/*.config.js,**/types/**,src/app/**,src/locales/**,src/lib/db-check.ts,src/lib/i18n-cookies.ts,src/actions/language.actions.ts,src/store/ui.store.ts,src/lib/db/index.ts,src/config/navigation.ts,src/lib/errors/api-errors.ts,src/lib/validations/auth.ts
# Duplication
sonar.cpd.exclusions=**/*.test.ts,**/*.test.tsx

# Issue suppressions
# S5976 (parameterized tests): descriptive test names are a deliberate BDD
# choice in this project — tests are excluded from this rule.
sonar.issue.ignore.multicriteria=s5976-test,s5976-testx,s5976-spec,s5976-specx,s6819-accountselect
sonar.issue.ignore.multicriteria.s5976-test.ruleKey=typescript:S5976
sonar.issue.ignore.multicriteria.s5976-test.resourceKey=**/*.test.ts
sonar.issue.ignore.multicriteria.s5976-testx.ruleKey=typescript:S5976
sonar.issue.ignore.multicriteria.s5976-testx.resourceKey=**/*.test.tsx
sonar.issue.ignore.multicriteria.s5976-spec.ruleKey=typescript:S5976
sonar.issue.ignore.multicriteria.s5976-spec.resourceKey=**/*.spec.ts
sonar.issue.ignore.multicriteria.s5976-specx.ruleKey=typescript:S5976
sonar.issue.ignore.multicriteria.s5976-specx.resourceKey=**/*.spec.tsx
# S6819 (listbox/option roles): the AccountSelect component intentionally
# implements the WAI-ARIA APG combobox pattern (role="listbox"/"option") to
# render a fully styled, grouped account dropdown — a native <select>/<option>
# cannot render this UI. The pattern is fully keyboard accessible and tested.
sonar.issue.ignore.multicriteria.s6819-accountselect.ruleKey=typescript:S6819
sonar.issue.ignore.multicriteria.s6819-accountselect.resourceKey=**/src/components/transactions/AccountSelect.tsx
